name: in-memory-database-engine

services:
  api:
    container_name: in-memory-db-api
    image: ${DOCKER_IMAGE:-in-memory-db-api}:${DOCKER_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8080
      REDIS_TCP_ENABLED: ${REDIS_TCP_ENABLED:-false}
      REDIS_TCP_PORT: ${REDIS_TCP_PORT:-6379}
    ports:
      - "${PORT:-8080}:8080"
      - "${REDIS_TCP_PORT:-6379}:${REDIS_TCP_PORT:-6379}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/products || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    container_name: in-memory-db-prometheus
    image: prom/prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    container_name: in-memory-db-grafana
    image: grafana/grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
