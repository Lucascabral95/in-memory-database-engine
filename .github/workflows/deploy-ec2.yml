name: Deploy EC2 (ECR + SSM)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/in_memory_db_test?sslmode=disable
      PORT: "8080"
      ENV: test
      JWT_SECRET: ci-test-secret
      REDIS_TCP_ENABLED: "false"
      REDIS_TCP_PORT: "6379"
      DB_MAX_OPEN_CONNS: "20"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFETIME: "5m"
      DB_CONN_MAX_IDLE_TIME: "1m"
      RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: in_memory_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d in_memory_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod/go.sum are tidy
        run: go mod tidy -diff

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o bin/api-ci ./cmd/api/main.go

  build-push-ecr:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deploy secrets
        run: |
          test -n "$AWS_REGION" || (echo "AWS_REGION is required" && exit 1)
          test -n "$ECR_REPOSITORY_URL" || (echo "ECR_REPOSITORY_URL is required" && exit 1)
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "AWS_ACCESS_KEY_ID is required" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "AWS_SECRET_ACCESS_KEY is required" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag "$ECR_REPOSITORY_URL:latest" \
            --tag "$ECR_REPOSITORY_URL:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "$ECR_REPOSITORY_URL:latest"
          docker push "$ECR_REPOSITORY_URL:${GITHUB_SHA}"

  deploy-ec2:
    name: Deploy on EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-push-ecr
    steps:
      - name: Validate required deploy secrets
        run: |
          test -n "$AWS_REGION" || (echo "AWS_REGION is required" && exit 1)
          test -n "$EC2_INSTANCE_ID" || (echo "EC2_INSTANCE_ID is required" && exit 1)
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "AWS_ACCESS_KEY_ID is required" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "AWS_SECRET_ACCESS_KEY is required" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command to EC2
        id: send_ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy in-memory-db ${GITHUB_SHA}" \
            --parameters 'commands=["sudo /usr/local/bin/fetch-env.sh","sudo systemctl restart in-memory-db","sudo systemctl status in-memory-db --no-pager"]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $COMMAND_ID"

      - name: Wait and validate deploy command
        run: |
          COMMAND_ID="${{ steps.send_ssm.outputs.command_id }}"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deploy command status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
