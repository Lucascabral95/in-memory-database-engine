name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/in_memory_db_test?sslmode=disable
      PORT: "8080"
      ENV: test
      JWT_SECRET: ci-test-secret
      REDIS_TCP_ENABLED: "false"
      REDIS_TCP_PORT: "6379"
      DB_MAX_OPEN_CONNS: "20"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFETIME: "5m"
      DB_CONN_MAX_IDLE_TIME: "1m"
      RUN_DB_TESTS: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: in_memory_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d in_memory_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod/go.sum are tidy
        run: go mod tidy -diff

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -covermode=atomic -coverprofile=coverage.out

      - name: Build application
        run: go build -o bin/api-ci ./cmd/api/main.go

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: go-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file Dockerfile --tag in-memory-db-api:ci .

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    needs: [go-build-test, docker-build]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.go-build-test.result }}" != "success" ]; then
            echo "go-build-test failed: ${{ needs.go-build-test.result }}"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "docker-build failed: ${{ needs.docker-build.result }}"
            exit 1
          fi
          echo "All required checks passed."
