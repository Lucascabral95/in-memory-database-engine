name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PORT: ${{ secrets.PORT }}
      ENV: ${{ secrets.ENV }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_TCP_ENABLED: ${{ secrets.REDIS_TCP_ENABLED }}
      REDIS_TCP_PORT: ${{ secrets.REDIS_TCP_PORT }}
      RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL secret is missing" && exit 1)
          test -n "$JWT_SECRET" || (echo "JWT_SECRET secret is missing" && exit 1)

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -covermode=atomic -coverprofile=coverage.out

      - name: Build application
        run: go build -o bin/api-ci ./cmd/api/main.go

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: go-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file Dockerfile --tag in-memory-db-api:ci .

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    needs: [go-build-test, docker-build]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.go-build-test.result }}" != "success" ]; then
            echo "go-build-test failed: ${{ needs.go-build-test.result }}"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "docker-build failed: ${{ needs.docker-build.result }}"
            exit 1
          fi
          echo "All required checks passed."
